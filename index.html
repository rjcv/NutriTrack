<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f9e44'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f7f7f8;--card:#fff;--border:#e5e5e7;--text:#1c1c1e;--sub:#79797f;
    --accent:#2f9e44;--accent-l:#eaf4ec;--red:#d92d20;--red-l:#fbecea;
    --yellow:#b3790a;--yellow-l:#faf3e6;--blue:#1971c2;--blue-l:#eaf1fa;
    --pink:#c2255c;--pink-l:#faecf1;--orange:#c2410c;--orange-l:#faf0e8;
    --shadow:rgba(0,0,0,.05);--overlay-bg:rgba(0,0,0,.35);
  }
  html[data-theme="dark"]{
    --bg:#131417;--card:#1c1d20;--border:#2c2d30;--text:#eeeef0;--sub:#98999e;
    --accent:#4cae62;--accent-l:#1c2921;--red:#e5675f;--red-l:#2c1e1d;
    --yellow:#c99a3f;--yellow-l:#2b2519;--blue:#5b9fdb;--blue-l:#1a2530;
    --pink:#d1699a;--pink-l:#2a1e26;--orange:#d1834f;--orange-l:#2b2118;
    --shadow:rgba(0,0,0,.35);--overlay-bg:rgba(0,0,0,.6);
  }
  html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom));
    transition:background-color .3s ease,color .3s ease;}
  h3{margin:0;font-size:17px}
  input,select,button,textarea{font-family:inherit;font-size:15px}
  input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:10px 12px;width:100%;outline:none}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 1px 2px var(--shadow)}
  .pad{padding:12px 12px 0}
  .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
  .row{display:flex;gap:8px;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .btn-primary{flex:1;background:var(--text);color:var(--card);border:none;border-radius:10px;padding:13px;font-weight:600;cursor:pointer;letter-spacing:-.01em}
  .btn-primary:disabled{background:var(--border);color:var(--sub);cursor:default}
  .btn-ghost{flex:1;background:none;color:var(--sub);border:1px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;font-weight:500}
  .btn-sm{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .chip{border:none;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .chip-green{background:var(--accent-l);color:var(--accent)}
  .chip-yellow{background:var(--yellow-l);color:var(--yellow)}
  .chip-blue{background:var(--blue-l);color:var(--blue)}
  .tag{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600}
  .del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px}
  .gauge{background:var(--border);border-radius:8px;height:10px;overflow:hidden}
  .gauge>div{height:100%;border-radius:8px;transition:width .4s}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border-radius:8px;padding:10px 0;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--sub)}
  .seg button.on{background:var(--accent-l);color:var(--accent);border-color:var(--accent);font-weight:700}
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .goalgrid button{border-radius:10px;padding:10px 6px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;text-align:center}
  .goalgrid button.on{background:var(--accent-l);color:var(--accent);border-color:var(--accent);font-weight:700}
  .warn{background:var(--orange-l);border:1px solid var(--orange);border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .warn div{font-size:13px;color:var(--orange);line-height:1.5}
  #nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);
    border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  #nav button{flex:1;background:none;border:none;color:var(--sub);font-size:10.5px;cursor:pointer;padding:9px 2px 8px;line-height:1.7;letter-spacing:-.01em}
  #nav button.on{color:var(--accent);font-weight:600}
  .overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px;max-height:88vh;overflow:auto;animation:slideUp .32s cubic-bezier(.32,.72,.35,1)}
  .overlay.closing{animation:fadeOut .26s ease forwards}
  .overlay.closing .sheet{animation:slideDown .28s cubic-bezier(.4,.0,.68,.06) forwards}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .pad>.card,.pad>.warn,.pad>button.card,.pad>.seg{animation:cardIn .35s ease backwards}
  .pad>*:nth-child(1){animation-delay:0ms}.pad>*:nth-child(2){animation-delay:40ms}
  .pad>*:nth-child(3){animation-delay:80ms}.pad>*:nth-child(4){animation-delay:120ms}
  .pad>*:nth-child(5){animation-delay:160ms}.pad>*:nth-child(6){animation-delay:200ms}
  .pad>*:nth-child(n+7){animation-delay:240ms}
  button{transition:transform .12s ease,opacity .12s ease}
  button:active{transform:scale(.96)}
  #nav button:active{transform:scale(.92)}
  .gauge>div{transition:width .8s cubic-bezier(.25,.8,.35,1)}
  .sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
  .libitem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card);
    border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid var(--border)}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px) scale(.9);background:var(--text);color:#fff;
    padding:10px 18px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .acc-head{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;
    padding:0;cursor:pointer;color:var(--text);text-align:left}
  .acc-title{font-size:15px;font-weight:700}
  .acc-arrow{font-size:12px;color:var(--sub);transition:transform .28s ease;display:inline-block}
  .acc-arrow.open{transform:rotate(90deg)}
  .acc-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s ease,margin-top .3s ease;margin-top:0}
  .acc-body.open{max-height:4000px;opacity:1;margin-top:14px}
</style>

<div id="header"></div>
<div id="content"></div>
<div id="nav"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
// ─── CONFIG ───
var APP_VERSION='1.13.1';
var K={data:'nutritrack_data',profile:'nutritrack_profile',library:'nutritrack_library',api:'nutritrack_apikey',recipes:'nutritrack_recipes',theme:'nutritrack_theme'};
var DEFAULT_PROFILE={age:'',weight:'',height:'',gender:'male',activity:'1.55',goal:'maintain',targetWeight:'',bodyFatCurrent:'',bodyFatTarget:''};
var ACTIVITY=[['1.2','Sedentário','Pouco ou nenhum exercício'],['1.375','Levemente ativo','Exercício 1–3x/semana'],
  ['1.55','Moderadamente ativo','Exercício 3–5x/semana'],['1.725','Muito ativo','Exercício 6–7x/semana'],
  ['1.9','Extremamente ativo','Atleta / trabalho físico intenso']];
var GOALS=[['gain','💪 Ganhar peso'],['lose','⬇️ Perder peso'],['maintain','⚖️ Manter peso'],['recomp','🔥 Perder gordura']];
var MEAL_TYPES=[['breakfast','🌅 Pequeno-almoço'],['morning_snack','☕ Lanche da manhã'],['lunch','🍽 Almoço'],['afternoon_snack','🍎 Lanche da tarde'],['dinner','🌙 Jantar'],['supper','🌃 Ceia']];
function suggestMealType(){
  var h=new Date().getHours();
  if(h>=5&&h<10)return 'breakfast';
  if(h>=10&&h<12)return 'morning_snack';
  if(h>=12&&h<15)return 'lunch';
  if(h>=15&&h<19)return 'afternoon_snack';
  if(h>=19&&h<22)return 'dinner';
  return 'supper';
}
function mealTypeLabel(id){var r='';MEAL_TYPES.forEach(function(m){if(m[0]===id)r=m[1];});return r;}
var MIN_BF={male:5,female:12},WARN_BF={male:10,female:18};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'});}
function fmtFull(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// Parse numeric input accepting both dot and comma as decimal separator (iOS Safari fix)
function num(v){if(v==null||v==='')return 0;var s=String(v).replace(',','.').replace(/[^\d.\-]/g,'');var n=parseFloat(s);return isNaN(n)?0:n;}
// Convert type="number" to type="text" with inputmode after render (iOS Safari comma support)
function fixDecimalInputs(){
  document.querySelectorAll('input[inputmode="decimal"]').forEach(function(el){
    if(el.type==='number'){el.type='text';el.setAttribute('autocomplete','off');}
  });
}

// ─── STATE ───
var S={data:load(K.data,{}),profile:load(K.profile,DEFAULT_PROFILE),library:load(K.library,[]),recipes:load(K.recipes,[]),apiKey:load(K.api,''),theme:load(K.theme,'auto'),tab:'Hoje',chartRange:7};
var tmpP=Object.assign({},S.profile);
var meal=null;
var recipeDraft=null;
var accOpen={profile:true,plan:true,theme:false,ai:false};

// ─── THEME ───
function applyTheme(){
  var mode=S.theme||'auto';
  var dark;
  if(mode==='dark')dark=true;
  else if(mode==='light')dark=false;
  else dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',dark?'#14171a':'#2f9e44');
}
// React to system changes when in auto mode
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var mqHandler=function(){if((S.theme||'auto')==='auto')applyTheme();};
  if(mq.addEventListener)mq.addEventListener('change',mqHandler);
  else if(mq.addListener)mq.addListener(mqHandler);
}
applyTheme();

// ─── SCIENCE ───
function calcMifflin(p){
  if(!p.age||!p.weight||!p.height)return null;
  var a=num(p.age),w=num(p.weight),h=num(p.height),act=num(p.activity)||1.55;
  var bmr=p.gender==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  return{bmr:Math.round(bmr),tdee:Math.round(bmr*act)};
}
function calcGoals(p){
  var base=calcMifflin(p);if(!base)return null;
  var bmr=base.bmr,tdee=base.tdee,w=num(p.weight);
  if(p.goal==='maintain'){
    var pr=Math.round(w*1.6),ft=Math.round(tdee*.3/9),cb=Math.max(0,Math.round((tdee-pr*4-ft*9)/4));
    return{bmr:bmr,tdee:tdee,target:tdee,protein:pr,carbs:cb,fat:ft,deficit:0,warnings:[],targetDate:null,daysNeeded:null};
  }
  if(p.goal==='gain'){
    var t1=tdee+400,pr1=Math.round(w*2.2),ft1=Math.round(t1*.28/9),cb1=Math.max(0,Math.round((t1-pr1*4-ft1*9)/4));
    return{bmr:bmr,tdee:tdee,target:t1,protein:pr1,carbs:cb1,fat:ft1,deficit:-400,warnings:[],targetDate:null,daysNeeded:null};
  }
  if(p.goal==='lose'){
    var tw=num(p.targetWeight),wr=[];
    if(!tw||tw>=w)return{bmr:bmr,tdee:tdee,target:tdee-500,protein:Math.round(w*2),carbs:150,fat:55,deficit:500,warnings:['Define o teu peso alvo no Perfil.'],targetDate:null,daysNeeded:null};
    var wl=Math.min(w*.0075,.9),def=Math.min(Math.round(wl*7700/7),750),t2=Math.max(1200,tdee-def);
    if(def===750)wr.push('⚠️ Défice ajustado para −750 kcal/dia (máximo saudável, ACSM).');
    if(tw<w*.8)wr.push('⚠️ Objetivo ambicioso (>20% do peso). Consulta um profissional.');
    var pr2=Math.round(w*2),ft2=Math.round(t2*.25/9),cb2=Math.max(0,Math.round((t2-pr2*4-ft2*9)/4));
    var days1=Math.round((w-tw)*7700/def),td1=new Date();td1.setDate(td1.getDate()+days1);
    return{bmr:bmr,tdee:tdee,target:t2,protein:pr2,carbs:cb2,fat:ft2,deficit:def,warnings:wr,daysNeeded:days1,targetDate:td1.toISOString().slice(0,10)};
  }
  if(p.goal==='recomp'){
    var bfC=num(p.bodyFatCurrent),bfT=num(p.bodyFatTarget),wr2=[];
    if(!bfC||!bfT||bfT>=bfC)return{bmr:bmr,tdee:tdee,target:tdee-350,protein:Math.round(w*2.4),carbs:130,fat:55,deficit:350,warnings:['Define a tua % de gordura atual e alvo no Perfil.'],targetDate:null,daysNeeded:null};
    var safe=Math.max(bfT,WARN_BF[p.gender]);
    if(bfT<MIN_BF[p.gender])wr2.push('⚠️ % alvo abaixo do mínimo saudável. Ajustado para '+WARN_BF[p.gender]+'%.');
    var lean=w*(1-bfC/100),fatLose=w*(bfC/100)-(lean/(1-safe/100))*(safe/100);
    var def2=p.gender==='male'?(bfC>20?500:bfC>15?350:250):(bfC>28?500:bfC>22?350:250);
    var t3=Math.max(1200,tdee-def2),pr3=Math.round(lean*2.5),ft3=Math.round(t3*.28/9),cb3=Math.max(0,Math.round((t3-pr3*4-ft3*9)/4));
    var days2=Math.round(Math.max(fatLose,.5)*7700/def2),td2=new Date();td2.setDate(td2.getDate()+days2);
    return{bmr:bmr,tdee:tdee,target:t3,protein:pr3,carbs:cb3,fat:ft3,deficit:def2,warnings:wr2,daysNeeded:days2,targetDate:td2.toISOString().slice(0,10),fatMassToLose:Math.round(fatLose*10)/10,safeBfT:safe};
  }
  return null;
}
function totals(m){return (m||[]).filter(function(x){return !x.isExercise;}).reduce(function(a,x){return{kcal:a.kcal+x.kcal,protein:a.protein+x.protein,carbs:a.carbs+x.carbs,fat:a.fat+x.fat,sugar:a.sugar+(x.sugar||0)};},{kcal:0,protein:0,carbs:0,fat:0,sugar:0});}
function exKcal(m){return (m||[]).filter(function(x){return x.isExercise;}).reduce(function(s,x){return s+x.kcal;},0);}
function dynamicTarget(macro){
  if(!macro||!macro.targetDate||S.profile.goal==='maintain'||S.profile.goal==='gain')return macro;
  var days=Object.keys(S.data).sort();
  if(days.length<2)return macro;
  var dl=days.map(function(d){var m=S.data[d]||[];return macro.tdee-(totals(m).kcal-exKcal(m));}).filter(function(x){return x>50;});
  if(!dl.length)return macro;
  var avg=dl.reduce(function(a,b){return a+b;},0)/dl.length;
  var kg=S.profile.goal==='lose'?(+S.profile.weight)-(+S.profile.targetWeight||+S.profile.weight*.9):macro.fatMassToLose||5;
  var dn=Math.round(kg*7700/Math.max(avg,100)),td=new Date();td.setDate(td.getDate()+dn);
  var c=Object.assign({},macro);c.daysNeeded=dn;c.targetDate=td.toISOString().slice(0,10);return c;
}

// ─── CHARTS ───
function lastN(n){
  var out=[];
  for(var i=n-1;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var key=d.toISOString().slice(0,10),m=S.data[key]||[],t=totals(m),ex=exKcal(m);
    out.push({date:key,label:d.toLocaleDateString('pt-PT',{day:'numeric',month:'numeric'}),shortLabel:d.toLocaleDateString('pt-PT',{weekday:'short'}).replace('.',''),kcal:t.kcal,protein:t.protein,carbs:t.carbs,fat:t.fat,sugar:t.sugar,net:t.kcal-ex});
  }
  return out;
}
function last7(){return lastN(7);}
function barChart(days,goal){
  var W=340,H=150,padL=8,padR=8,padB=24,padT=10,innerH=H-padB-padT;
  var vals=days.map(function(d){return d.net;});
  var max=Math.max.apply(null,[goal||0].concat(vals).concat([1]))*1.15;
  var slot=(W-padL-padR)/days.length,rects='',labels='';
  var showEvery=days.length>14?Math.ceil(days.length/7):1;
  days.forEach(function(d,i){
    var bh=d.net>0?(d.net/max)*innerH:0,bw=Math.min(slot*.6,20),x=padL+i*slot+(slot-bw)/2,y=padT+innerH-bh;
    var col=d.net===0?'var(--border)':d.net>goal?'var(--red)':'var(--accent)';
    rects+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="2" fill="'+col+'"/>';
    if(i%showEvery===0){
      var lab=days.length>14?d.label:d.shortLabel;
      labels+='<text x="'+(padL+i*slot+slot/2).toFixed(1)+'" y="'+(H-7)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+esc(lab)+'</text>';
    }
  });
  var gl='';
  if(goal){var gy=padT+innerH-(goal/max)*innerH;gl='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+gl+rects+labels+'</svg>';
}
function lineChart(days,showSugar){
  var W=340,H=150,padL=8,padR=8,padB=24,padT=10,innerH=H-padB-padT;
  var all=[];days.forEach(function(d){all.push(d.protein,d.carbs,d.fat);if(showSugar)all.push(d.sugar||0);});
  var max=Math.max.apply(null,all.concat([1]))*1.15;
  var slot=(W-padL-padR)/(days.length-1||1),paths='',labels='';
  var showEvery=days.length>14?Math.ceil(days.length/7):1;
  var series=[['protein','var(--blue)'],['carbs','var(--yellow)'],['fat','var(--pink)']];
  if(showSugar)series.push(['sugar','var(--orange)']);
  series.forEach(function(kc){
    var pts=days.map(function(d,i){var x=padL+i*slot,y=padT+innerH-((d[kc[0]]||0)/max)*innerH;return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    paths+='<polyline points="'+pts+'" fill="none" stroke="'+kc[1]+'" stroke-width="'+(days.length>30?1.5:2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  days.forEach(function(d,i){
    if(i%showEvery===0){
      var lab=days.length>14?d.label:d.shortLabel;
      labels+='<text x="'+(padL+i*slot).toFixed(1)+'" y="'+(H-7)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+esc(lab)+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+paths+labels+'</svg>';
}

// ─── UI HELPERS ───
function gauge(label,value,goal,color,unit,mode){
  unit=unit||'g';
  var pct=Math.min(100,goal?Math.round(value/goal*100):0);
  var ratio=goal?value/goal:0;
  var barColor,valColor;
  if(mode==='calorie'){
    // Budget: green under goal, yellow near, red over
    var over=value>goal;
    barColor=over?'var(--red)':value>goal*.9?'var(--yellow)':'var(--accent)';
    valColor=over?'var(--red)':'var(--accent)';
  }else if(mode==='protein'){
    // Reach target: green when >=100%, accent color while building
    barColor=ratio>=1?'var(--accent)':color;
    valColor=ratio>=1?'var(--accent)':'var(--sub)';
  }else if(mode==='sugar'){
    // Limit: green under, red over (like calories)
    var overS=value>goal;
    barColor=overS?'var(--red)':value>goal*.85?'var(--yellow)':color;
    valColor=overS?'var(--red)':'var(--sub)';
  }else{
    // carbs/fat: green at target, yellow slightly over, red well over (>110%)
    barColor=ratio>1.1?'var(--red)':ratio>=0.9?'var(--accent)':color;
    valColor=ratio>1.1?'var(--red)':ratio>=0.9?'var(--accent)':'var(--sub)';
  }
  return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'+
    '<span style="font-weight:600">'+label+'</span><span style="color:'+valColor+'">'+value+
    '<span style="color:var(--sub)">/'+goal+unit+'</span></span></div>'+
    '<div class="gauge"><div class="gauge-fill" data-pct="'+pct+'" style="width:0%;background:'+barColor+'"></div></div></div>';
}
// Animate gauge bars from 0 to their target width, and count-up numbers
function animateUI(){
  requestAnimationFrame(function(){
    document.querySelectorAll('.gauge-fill').forEach(function(el){
      el.style.width=el.getAttribute('data-pct')+'%';
    });
    document.querySelectorAll('.ring-fill').forEach(function(el){
      el.style.transition='stroke-dashoffset 1s cubic-bezier(.25,.8,.35,1)';
      el.style.strokeDashoffset=el.getAttribute('data-offset');
    });
    document.querySelectorAll('[data-countup]').forEach(function(el){
      var target=parseInt(el.getAttribute('data-countup'),10)||0;
      var isNeg=target<0,absT=Math.abs(target);
      var dur=700,start=null;
      function step(ts){
        if(!start)start=ts;
        var p=Math.min(1,(ts-start)/dur);
        var eased=1-Math.pow(1-p,3);
        var v=Math.round(absT*eased);
        el.textContent=(isNeg?'−':'')+v;
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      el.removeAttribute('data-countup');
    });
  });
}
function tag(txt,color,bg){return '<span class="tag" style="color:'+color+';background:'+bg+'">'+txt+'</span>';}
// Apple-Watch style progress ring
function progressRing(consumed,goal,exercise,remaining){
  var size=200,stroke=16,r=(size-stroke)/2,cx=size/2,cy=size/2;
  var circ=2*Math.PI*r;
  var pct=goal?Math.min(consumed/goal,1):0;
  var over=remaining<0;
  var mainCol=over?'var(--red)':consumed>goal*0.9?'var(--yellow)':'var(--accent)';
  var dash=circ*pct;
  var label=over?'Excedeste em':'Ainda podes consumir';
  var bigVal=over?Math.abs(remaining):remaining;
  return '<svg viewBox="0 0 '+size+' '+size+'" width="200" height="200" style="display:block;margin:0 auto">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+stroke+'"/>'+
    '<circle class="ring-fill" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+mainCol+'" stroke-width="'+stroke+'" '+
    'stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+circ.toFixed(1)+'" '+
    'data-offset="'+(circ-dash).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>'+
    '<text x="'+cx+'" y="'+(cy-18)+'" text-anchor="middle" font-size="10.5" fill="var(--sub)" font-weight="600" letter-spacing="0.02em">'+label.toUpperCase()+'</text>'+
    '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="40" font-weight="700" fill="'+mainCol+'" letter-spacing="-0.02em">'+
    '<tspan data-countup="'+(over?-bigVal:bigVal)+'">'+(over?'−'+bigVal:bigVal)+'</tspan></text>'+
    '<text x="'+cx+'" y="'+(cy+36)+'" text-anchor="middle" font-size="11" fill="var(--sub)">kcal</text>'+
    '</svg>';
}
function warnBox(ws){if(!ws||!ws.length)return '';return '<div class="warn">'+ws.map(function(w){return '<div>'+esc(w)+'</div>';}).join('')+'</div>';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

// ─── COMPUTE ───
function compute(){
  var tk=today(),meals=S.data[tk]||[],macro=calcGoals(S.profile),active=dynamicTarget(macro);
  var tt=totals(meals),ex=exKcal(meals),net=tt.kcal-ex;
  var eff={kcal:macro?macro.target:2000,protein:macro?macro.protein:150,carbs:macro?macro.carbs:200,fat:macro?macro.fat:65};
  eff.sugar=Math.round(eff.kcal*0.05/4);
  var balance=macro?macro.tdee-net:0;
  return{tk:tk,meals:meals,macro:macro,active:active,tt:tt,ex:ex,net:net,eff:eff,balance:balance};
}

function previewCard(pm){
  if(!pm)return '<div style="text-align:center;color:var(--sub);font-size:13px;padding:8px">Preenche idade, peso e altura na secção acima para veres o teu cálculo personalizado.</div>';
  var goalLabel='';GOALS.forEach(function(g){if(g[0]===tmpP.goal)goalLabel=g[1];});
  var actLabel='';ACTIVITY.forEach(function(a){if(a[0]===tmpP.activity)actLabel=a[1];});

// ─── GEMINI API ───
var GEMINI_MODELS=['gemini-3.1-flash-lite','gemini-flash-lite-latest','gemini-2.5-flash-lite'];
function callAnthropic(messages,maxTokens,jsonMode){
  if(!S.apiKey)return Promise.reject(new Error('Sem chave API'));
  var contents=messages.map(function(m){
    if(m.image){
      return{role:'user',parts:[{inlineData:{mimeType:m.image.mime,data:m.image.data}},{text:m.content}]};
    }
    return{role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]};
  });
  function doCall(modelIdx,withThinking){
    var model=GEMINI_MODELS[modelIdx]||GEMINI_MODELS[0];
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';
    var cfg={maxOutputTokens:maxTokens};
    if(withThinking)cfg.thinkingConfig={thinkingBudget:0};
    if(jsonMode)cfg.responseMimeType='application/json';
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey},
      body:JSON.stringify({contents:contents,generationConfig:cfg})
    }).catch(function(err){
      throw new Error('Network: '+((err&&err.message)||err||'falhou'));
    }).then(function(r){
      if(!r.ok){
        return r.text().then(function(t){
          // Model missing/deprecated, or no access on current tier → try next model in the fallback list
          if((r.status===404||r.status===403)&&modelIdx<GEMINI_MODELS.length-1){
            return doCall(modelIdx+1,withThinking);
          }
          // Possibly thinkingConfig related → retry once without it on the same model
          if(withThinking&&r.status===400){
            return doCall(modelIdx,false);
          }
          // Still failing without thinking too → this model generation may be incompatible, try next
          if(!withThinking&&r.status===400&&modelIdx<GEMINI_MODELS.length-1){
            return doCall(modelIdx+1,true);
          }
          throw new Error('HTTP '+r.status+' '+t.slice(0,200));
        });
      }
      return r.json();
    });
  }
  return doCall(0,true).then(function(d){
    var cand=d&&d.candidates&&d.candidates[0];
    if(!cand){
      if(d&&d.promptFeedback&&d.promptFeedback.blockReason)throw new Error('Bloqueado: '+d.promptFeedback.blockReason);
      throw new Error('Sem candidatos.');
    }
    var parts=cand.content&&cand.content.parts;
    var txt=parts&&parts.length?parts.map(function(p){return p.text||'';}).join(''):'';
    if(!txt){
      var fr=cand.finishReason||'desconhecido';
      throw new Error('Resposta vazia (finishReason='+fr+')');
    }
    return txt;
  });
}
// Read an image file, downscale it, return {mime,data} base64 (no prefix)
function readImageFile(file,maxDim){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onerror=function(){reject(new Error('Falha ao ler imagem'));};
    reader.onload=function(ev){
      var img=new Image();
      img.onerror=function(){reject(new Error('Imagem inválida'));};
      img.onload=function(){
        var w=img.width,hh=img.height,scale=Math.min(1,(maxDim||1024)/Math.max(w,hh));
        var cw=Math.round(w*scale),ch=Math.round(hh*scale);
        var canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
        canvas.getContext('2d').drawImage(img,0,0,cw,ch);
        var dataUrl=canvas.toDataURL('image/jpeg',0.85);
        resolve({mime:'image/jpeg',data:dataUrl.split(',')[1]});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function extractJSON(txt){
  var clean=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{return JSON.parse(clean);}catch(e){}
  var s=clean.indexOf('{'),e2=clean.lastIndexOf('}');
  if(s>=0&&e2>s){
    try{return JSON.parse(clean.slice(s,e2+1));}catch(e){}
  }
  throw new Error('JSON inválido');
}
function apiErr(e){var m=(e&&e.message)||'erro';if(m.indexOf('429')>=0)return 'demasiados pedidos — espera ~30 segundos';if(m.indexOf('400')>=0)return 'pedido inválido: '+m.slice(0,120);if(m.indexOf('401')>=0||m.indexOf('403')>=0)return 'chave inválida ou sem permissão';if(m.indexOf('Network')>=0||m.indexOf('Failed to fetch')>=0)return 'sem ligação ou bloqueado: '+m.slice(0,120);return m.slice(0,150);}

function exportData(){
  var backup={version:3,exportedAt:new Date().toISOString(),profile:S.profile,data:S.data,library:S.library,recipes:S.recipes,theme:S.theme};
  var json=JSON.stringify(backup,null,2),filename='nutritrack_backup_'+today()+'.json';
  try{
    var file=new File([json],filename,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'NutriTrack Backup'}).catch(function(){fallbackDownload(json,filename);});
      return;
    }
  }catch(e){}
  fallbackDownload(json,filename);
}
function fallbackDownload(json,filename){
  var blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('Backup exportado');
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var b=JSON.parse(ev.target.result);
      if(!b.version||!b.data)throw new Error('inv');
      if(confirm('Isto irá substituir todos os dados atuais. Tens a certeza?')){
        if(b.data){S.data=b.data;save(K.data,S.data);}
        if(b.profile){S.profile=b.profile;tmpP=Object.assign({},b.profile);save(K.profile,S.profile);}
        if(b.library){S.library=b.library;save(K.library,S.library);}
        if(b.recipes){S.recipes=b.recipes;save(K.recipes,S.recipes);}
        if(b.theme){S.theme=b.theme;save(K.theme,S.theme);applyTheme();}
        render();toast('✅ Dados restaurados');
      }
    }catch(e){toast('❌ Ficheiro inválido');}
  };
  reader.readAsText(file);
}

// ─── AI CHAT (nutrition/fitness assistant, opens with daily report) ───
var chatHistory=[];
function buildSystemContext(){
  var c=compute();
  var goalLabel='';GOALS.forEach(function(g){if(g[0]===S.profile.goal)goalLabel=g[1];});
  var consumed=c.tt.kcal,remaining=c.eff.kcal-consumed+c.ex;
  var ctx='És um assistente especializado em nutrição, fitness e exercício físico. Respondes sempre em português europeu, de forma prática, encorajadora e baseada em evidência científica. Dás conselhos concretos e acionáveis. Não és médico — para questões clínicas sugere consultar um profissional.\n\n';
  ctx+='=== PERFIL DO UTILIZADOR ===\n';
  ctx+='Idade: '+(S.profile.age||'?')+' anos · Peso: '+(S.profile.weight||'?')+'kg · Altura: '+(S.profile.height||'?')+'cm · Sexo: '+(S.profile.gender==='male'?'masculino':'feminino')+'\n';
  ctx+='Objetivo: '+goalLabel+'\n';
  if(c.macro){ctx+='TMB: '+c.macro.bmr+' kcal · TDEE: '+c.macro.tdee+' kcal · Meta diária: '+c.eff.kcal+' kcal (P:'+c.eff.protein+'g H:'+c.eff.carbs+'g G:'+c.eff.fat+'g)\n';}
  if(S.profile.goal==='lose'&&S.profile.targetWeight)ctx+='Peso alvo: '+S.profile.targetWeight+'kg\n';
  if(S.profile.goal==='recomp'&&S.profile.bodyFatCurrent)ctx+='% gordura atual: '+S.profile.bodyFatCurrent+'% · alvo: '+S.profile.bodyFatTarget+'%\n';
  var nowH=new Date().getHours();var nowHStr=(nowH<10?'0':'')+nowH+':00';
  ctx+='\n=== HOJE ('+fmtFull(c.tk)+', agora são '+nowHStr+') ===\n';
  ctx+='Consumido: '+consumed+' kcal (P:'+c.tt.protein+'g H:'+c.tt.carbs+'g G:'+c.tt.fat+'g Açúcar:'+Math.round(c.tt.sugar*10)/10+'g de limite '+c.eff.sugar+'g)\n';
  ctx+='Exercício: '+c.ex+' kcal · Ainda pode consumir: '+remaining+' kcal\n';
  var mealsToday=c.meals.filter(function(m){return !m.isExercise;});
  ctx+='Refeições de hoje: '+(mealsToday.map(function(m){return (m.mealType?mealTypeLabel(m.mealType)+': ':'')+m.name+' ('+m.kcal+'kcal)';}).join(', ')||'nenhuma')+'\n';
  var doneTypes={};mealsToday.forEach(function(m){if(m.mealType)doneTypes[m.mealType]=true;});
  var missingTypes=MEAL_TYPES.filter(function(mt){return !doneTypes[mt[0]];}).map(function(mt){return mt[1];});
  if(missingTypes.length)ctx+='Momentos do dia AINDA NÃO registados: '+missingTypes.join(', ')+'. Usa isto para perceber quantas refeições ainda faltam e ajustar as sugestões (ex: se for tarde e faltar o jantar, sugere algo para o jantar; se já passou a hora normal de uma refeição e não foi registada, podes assumir que ainda vai acontecer ou foi saltada — pergunta se tiveres dúvida).\n';
  var exList=c.meals.filter(function(m){return m.isExercise;});
  if(exList.length)ctx+='Exercício de hoje: '+exList.map(function(m){return m.name+' ('+m.kcal+'kcal)';}).join(', ')+'\n';
  // Recent history (last 5 logged days)
  var keys=Object.keys(S.data).sort().reverse().filter(function(d){return d!==c.tk&&(S.data[d]||[]).length;}).slice(0,5);
  if(keys.length){
    ctx+='\n=== ÚLTIMOS DIAS ===\n';
    keys.forEach(function(d){var m=S.data[d],t=totals(m),ex=exKcal(m);ctx+=fmt(d)+': '+t.kcal+' kcal consumidas, '+ex+' kcal exercício\n';});
  }
  return ctx;
}

function openReport(){
  chatHistory=[];
  var h='<div class="overlay"><div class="sheet" style="display:flex;flex-direction:column;height:88vh;max-height:88vh;padding:0">'+
    '<div style="padding:16px 16px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0">'+
    '<div><div style="font-weight:700;font-size:17px">💬 Assistente Nutrição & Fitness</div>'+
    '<div style="font-size:11px;color:var(--sub)">Especializado no teu perfil e objetivos</div></div>'+
    '<button class="btn-ghost" id="chatClose" style="flex:0;padding:6px 14px">Fechar</button></div>'+
    '<div id="chatMessages" style="flex:1;overflow-y:auto;padding:14px;background:var(--bg)"></div>'+
    '<div style="padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0;background:var(--card)">'+
    '<div class="row"><input id="chatInput" placeholder="Faz uma pergunta…" style="flex:1" disabled>'+
    '<button class="btn-sm" id="chatSend" disabled>➤</button></div></div>'+
    '</div></div>';
  document.getElementById('modal-root').innerHTML=h;
  document.getElementById('chatClose').addEventListener('click',closeModal);

  var msgs=document.getElementById('chatMessages'),input=document.getElementById('chatInput'),send=document.getElementById('chatSend');

  if(!S.apiKey){
    msgs.innerHTML='<div style="color:var(--sub);text-align:center;padding:32px;font-size:14px">Para usar o assistente com IA, adiciona a tua chave API do Google AI Studio no separador <b>Perfil</b>.</div>';
    return;
  }

  function addMsg(role,text,isLoading){
    var wrap=document.createElement('div');
    wrap.style.cssText='margin-bottom:12px;display:flex;'+(role==='user'?'justify-content:flex-end':'justify-content:flex-start');
    var bubble=document.createElement('div');
    bubble.style.cssText='max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;'+
      (role==='user'?'background:var(--accent);color:#fff;border-bottom-right-radius:4px':'background:var(--card);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px');
    bubble.textContent=text;
    if(isLoading)bubble.id='chatLoading';
    wrap.appendChild(bubble);msgs.appendChild(wrap);
    msgs.scrollTop=msgs.scrollHeight;
    return bubble;
  }

  function sendToAI(userText,isFirst){
    if(!isFirst){chatHistory.push({role:'user',content:userText});}
    var loading=addMsg('assistant','…',true);
    // Build messages: system context as first user turn, then history
    var apiMessages=[];
    var sys=buildSystemContext();
    if(isFirst){
      apiMessages.push({role:'user',content:sys+'\n\nFaz agora um relatório breve do dia de hoje (máx 150 palavras): avalia como está a correr o dia face aos objetivos, tendo em conta a hora atual e que momentos do dia (pequeno-almoço, almoço, jantar, etc.) ainda faltam ou já passaram, o que falta consumir, e dá 1-2 sugestões concretas e realistas para o resto do dia. Termina convidando a fazer perguntas.'});
    }else{
      apiMessages.push({role:'user',content:sys+'\n\nO utilizador vai agora fazer perguntas. Responde de forma útil e concisa.'});
      apiMessages.push({role:'assistant',content:'Entendido. Estou aqui para ajudar com nutrição, treino e os teus objetivos. O que gostarias de saber?'});
      chatHistory.forEach(function(m){apiMessages.push(m);});
    }
    callAnthropic(apiMessages,2000,false)
    .then(function(txt){
      var el=document.getElementById('chatLoading');if(el)el.remove();
      addMsg('assistant',txt||'Sem resposta.');
      chatHistory.push({role:'assistant',content:txt||''});
      input.disabled=false;send.disabled=false;input.focus();
    })
    .catch(function(e){
      var el=document.getElementById('chatLoading');if(el)el.remove();
      addMsg('assistant','⚠️ Erro: '+apiErr(e));
      input.disabled=false;send.disabled=false;
    });
  }

  function doSend(){
    var txt=input.value.trim();if(!txt)return;
    input.value='';input.disabled=true;send.disabled=true;
    addMsg('user',txt);
    sendToAI(txt,false);
  }
  send.addEventListener('click',doSend);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doSend();}});

  // Kick off with the daily report
  sendToAI(null,true);
}

  document.getElementById('rName').addEventListener('input',function(e){recipeDraft.name=e.target.value;});
  document.getElementById('rCooked').addEventListener('input',function(e){recipeDraft.cookedWeight=e.target.value;});
  document.getElementById('rServing').addEventListener('input',function(e){recipeDraft.servingSize=e.target.value;});
}
function recalcRecipeTotals(){
  var t={kcal:0,protein:0,carbs:0,fat:0,sugar:0};
  recipeDraft.ingredients.forEach(function(ing){
    t.kcal+=ing.kcal||0;t.protein+=ing.protein||0;t.carbs+=ing.carbs||0;t.fat+=ing.fat||0;t.sugar+=ing.sugar||0;
  });
  t.kcal=Math.round(t.kcal);t.protein=Math.round(t.protein*10)/10;t.carbs=Math.round(t.carbs*10)/10;t.fat=Math.round(t.fat*10)/10;t.sugar=Math.round(t.sugar*10)/10;
  recipeDraft.totals=t;
  recipeDraft.rawWeight=recipeDraft.ingredients.reduce(function(s,i){return s+(+i.weight||0);},0);
}
function saveRecipeDraft(){
  recalcRecipeTotals();
  if(recipeDraft._idx>=0){S.recipes[recipeDraft._idx]=recipeDraft;}
  else{S.recipes=S.recipes.concat([recipeDraft]);}
  save(K.recipes,S.recipes);
  recipeDraft=null;closeModal();setTimeout(function(){render();toast('Receita guardada');},290);
}
function deleteRecipe(idx){
  if(!confirm('Apagar esta receita?'))return;
  S.recipes=S.recipes.filter(function(_,i){return i!==idx;});save(K.recipes,S.recipes);render();
}

function openIngredientPicker(){
  var hasKey=!!S.apiKey;
  var h='<div class="overlay"><div class="sheet">'+
    '<div class="sheet-head"><h3>🥕 Adicionar Ingrediente</h3></div>'+
    '<label class="lbl">Nome do ingrediente</label>'+
    '<input id="iName" placeholder="ex: farinha de espelta integral" style="margin-bottom:8px">'+
    '<label class="lbl">Quantidade visível na receita (opcional)</label>'+
    '<input id="iQty" placeholder="ex: 400g, 2 colheres, 1 chávena" style="margin-bottom:8px">'+
    '<label class="lbl">Peso em gramas</label>'+
    '<input id="iWeight" type="number" inputmode="decimal" placeholder="ex: 400" style="margin-bottom:10px">'+
    (hasKey?'<button class="btn-sm" id="iAnalyze" style="width:100%;margin-bottom:14px;background:var(--accent);color:#fff">🤖 Calcular calorias e nutrientes com IA</button>':'<div class="hint" style="margin-bottom:10px">💡 Adiciona uma chave API no Perfil para cálculo automático.</div>')+
    '<div id="iStatus" style="min-height:0"></div>'+
    '<label class="lbl">Calorias (kcal)</label><input id="iKcal" type="number" inputmode="numeric" style="margin-bottom:8px">'+
    '<div class="grid4" style="margin-bottom:12px">'+
    '<div><label class="lbl">Proteína g</label><input id="iProtein" type="number" inputmode="decimal"></div>'+
    '<div><label class="lbl">Hidratos g</label><input id="iCarbs" type="number" inputmode="decimal"></div>'+
    '<div><label class="lbl">Gordura g</label><input id="iFat" type="number" inputmode="decimal"></div>'+
    '<div><label class="lbl">Açúcar g</label><input id="iSugar" type="number" inputmode="decimal"></div></div>'+
    '<div class="row"><button class="btn-primary" id="iSave" disabled>Adicionar</button>'+
    '<button class="btn-ghost" id="iCancel">Cancelar</button></div>'+
    '</div></div>';
  document.getElementById('modal-root').innerHTML=h;

  var iN=document.getElementById('iName'),iQ=document.getElementById('iQty'),
      iW=document.getElementById('iWeight'),iK=document.getElementById('iKcal'),
      iP=document.getElementById('iProtein'),iC=document.getElementById('iCarbs'),iF=document.getElementById('iFat'),
      sv=document.getElementById('iSave'),st=document.getElementById('iStatus');
  function upd(){sv.disabled=!(iN.value.trim()&&iK.value&&iW.value);}
  [iN,iK,iW].forEach(function(el){el.addEventListener('input',upd);});
  document.getElementById('iCancel').addEventListener('click',renderRecipeEditor);
  sv.addEventListener('click',function(){
    recipeDraft.ingredients.push({name:iN.value.trim(),qty:iQ.value.trim(),weight:num(iW.value),kcal:Math.round(num(iK.value)),protein:num(iP.value),carbs:num(iC.value),fat:num(iF.value)});
    recalcRecipeTotals();renderRecipeEditor();
  });
  var an=document.getElementById('iAnalyze');
  if(an)an.addEventListener('click',function(){
    if(!iN.value.trim()){st.innerHTML='<div style="color:var(--red);font-size:13px;margin-bottom:8px">⚠️ Indica primeiro o nome do ingrediente.</div>';return;}
    if(!iW.value){st.innerHTML='<div style="color:var(--red);font-size:13px;margin-bottom:8px">⚠️ Indica primeiro o peso em gramas.</div>';return;}
    analyzeIngredient();
  });

  function analyzeIngredient(){
    var name=iN.value.trim(),weight=+iW.value||0,qty=iQ.value.trim();
    var query=weight+'g de '+name+(qty?' ('+qty+')':'');
    st.innerHTML='<div style="text-align:center;color:var(--sub);padding:8px 0;font-size:14px">🤖 A calcular com IA…</div>';
    callAnthropic([{role:'user',content:'Calcula os valores nutricionais para: "'+query+'".\nResponde APENAS com um objeto JSON válido, sem markdown, exactamente neste formato:\n{"kcal":000,"protein":00,"carbs":00,"fat":00,"sugar":00}\nsugar é o açúcar em gramas (subconjunto dos hidratos). Usa valores realistas para a quantidade indicada ('+weight+' gramas).'}],1500,false)
    .then(function(txt){
      try{
        var p=extractJSON(txt);
        iK.value=Math.round(num(p.kcal));
        iP.value=Math.round(num(p.protein)*10)/10;
        iC.value=Math.round(num(p.carbs)*10)/10;
        iF.value=Math.round(num(p.fat)*10)/10;
        iSug.value=Math.round(num(p.sugar)*10)/10;
        st.innerHTML='<div style="font-size:13px;color:var(--accent);margin-bottom:8px;font-weight:600">✅ Valores calculados — ajusta se necessário</div>';
        upd();
      }catch(e){st.innerHTML='<div style="color:var(--red);font-size:12px;margin-bottom:8px">⚠️ Resposta inesperada. Preenche manualmente.</div>';}
    })
    .catch(function(e){st.innerHTML='<div style="color:var(--red);font-size:13px;margin-bottom:8px">Erro: '+esc(apiErr(e))+'</div>';});
  }
}

function openBulkIngredients(){
  var h='<div class="overlay"><div class="sheet">'+
    '<div class="sheet-head"><h3>🤖 Analisar receita com IA</h3></div>'+
    '<div class="hint" style="margin-top:0;margin-bottom:8px">Escreve todos os ingredientes (um por linha ou separados por vírgula). A IA analisa todos de uma vez.</div>'+
    '<label class="lbl">Ingredientes da receita</label>'+
    '<textarea id="bIng" rows="7" style="margin-bottom:4px" placeholder="ex:&#10;400g farinha de espelta integral&#10;60g pasta de tâmaras&#10;280ml água&#10;8g sal&#10;4g fermento"></textarea>'+
    '<div class="hint" style="margin-bottom:12px">💡 Quanto mais específico, mais precisa será a análise.</div>'+
    '<div id="bStatus" style="min-height:0;margin-bottom:8px"></div>'+
    '<div id="bPreview"></div>'+
    '<div class="row" style="margin-top:8px">'+
    '<button class="btn-primary" id="bAnalyze">🤖 Analisar com IA</button>'+
    '<button class="btn-ghost" id="bCancel">Cancelar</button></div>'+
    '</div></div>';
  document.getElementById('modal-root').innerHTML=h;
  var ta=document.getElementById('bIng'),st=document.getElementById('bStatus'),pv=document.getElementById('bPreview'),
      btn=document.getElementById('bAnalyze');
  document.getElementById('bCancel').addEventListener('click',renderRecipeEditor);
  btn.addEventListener('click',function(){
    var txt=ta.value.trim();
    if(!txt||txt.length<5){st.innerHTML='<div style="color:var(--red);font-size:13px">Escreve pelo menos um ingrediente.</div>';return;}
    btn.disabled=true;
    st.innerHTML='<div style="text-align:center;color:var(--sub);padding:8px 0;font-size:14px">🤖 A analisar todos os ingredientes…</div>';
    pv.innerHTML='';
    var prompt='Analisa esta lista de ingredientes de uma receita e estima os valores nutricionais de cada um.\n\nLista:\n'+txt+'\n\nResponde APENAS com um objeto JSON válido, sem markdown, exactamente neste formato:\n{"ingredients":[{"name":"nome limpo","qty":"quantidade visível","weight":000,"kcal":000,"protein":00,"carbs":00,"fat":00,"sugar":00}]}\n\nO campo weight é o peso em gramas. sugar é o açúcar em gramas (subconjunto dos hidratos). Para cada ingrediente, usa valores realistas para a quantidade indicada.';
    callAnthropic([{role:'user',content:prompt}],4000,false)
    .then(function(rsp){
      try{
        var p=extractJSON(rsp);
        if(!p.ingredients||!p.ingredients.length)throw new Error('Sem ingredientes na resposta');
        st.innerHTML='<div style="font-size:13px;color:var(--accent);margin-bottom:8px;font-weight:600">✅ '+p.ingredients.length+' ingredientes analisados</div>';
        var tot={kcal:0,protein:0,carbs:0,fat:0,sugar:0,weight:0};
        var html='';
        p.ingredients.forEach(function(ing){
          tot.kcal+=ing.kcal||0;tot.protein+=ing.protein||0;tot.carbs+=ing.carbs||0;tot.fat+=ing.fat||0;tot.sugar+=ing.sugar||0;tot.weight+=ing.weight||0;
          html+='<div style="background:var(--bg);border-radius:8px;padding:10px;margin-bottom:6px">'+
            '<div style="font-weight:600;font-size:13px">'+esc(ing.name||'?')+(ing.qty?' <span style="color:var(--sub);font-weight:400">— '+esc(ing.qty)+'</span>':'')+'</div>'+
            '<div style="font-size:11px;color:var(--sub);margin-top:2px">'+(ing.weight||0)+'g · '+(ing.kcal||0)+' kcal · P:'+(ing.protein||0)+'g H:'+(ing.carbs||0)+'g G:'+(ing.fat||0)+'g'+(ing.sugar?' Aç:'+ing.sugar+'g':'')+'</div></div>';
        });
        html+='<div style="background:var(--accent-l);border-radius:10px;padding:12px;margin-top:8px">'+
          '<div style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px">📊 Total estimado</div>'+
          '<div style="font-size:14px;line-height:1.6"><b>'+Math.round(tot.kcal)+' kcal</b> · P:'+Math.round(tot.protein)+'g · H:'+Math.round(tot.carbs)+'g · G:'+Math.round(tot.fat)+'g · Aç:'+Math.round(tot.sugar)+'g · '+tot.weight+'g</div></div>';
        html+='<button class="btn-primary" id="bConfirm" style="width:100%;margin-top:12px">✅ Adicionar todos à receita</button>';
        pv.innerHTML=html;
        document.getElementById('bConfirm').addEventListener('click',function(){
          p.ingredients.forEach(function(ing){
            recipeDraft.ingredients.push({
              name:ing.name||'?',qty:ing.qty||'',weight:+ing.weight||0,
              kcal:Math.round(ing.kcal||0),protein:Math.round((ing.protein||0)*10)/10,
              carbs:Math.round((ing.carbs||0)*10)/10,fat:Math.round((ing.fat||0)*10)/10,
              sugar:Math.round((ing.sugar||0)*10)/10
            });
          });
          recalcRecipeTotals();renderRecipeEditor();
        });
      }catch(e){
        st.innerHTML='<div style="color:var(--red);font-size:12px">⚠️ Resposta inesperada. Tenta novamente ou adiciona individualmente.</div>';
        btn.disabled=false;
      }
    })
    .catch(function(e){
      st.innerHTML='<div style="color:var(--red);font-size:13px">Erro: '+esc(apiErr(e))+'</div>';
      btn.disabled=false;
    });
  });
}

function openRecipePicker(){
  if(!S.recipes.length){toast('Sem receitas guardadas');return;}
  var h='<div class="overlay"><div class="sheet">'+
    '<div class="sheet-head"><h3>📖 Escolher Receita</h3>'+
    '<button class="btn-ghost" id="rpClose" style="flex:0;padding:6px 14px">Fechar</button></div>';
  S.recipes.forEach(function(r,i){
    var w=r.cookedWeight||r.rawWeight||1;
    var kPer100=Math.round(r.totals.kcal/w*100);
    h+='<div class="libitem" data-act="rp-pick" data-idx="'+i+'">'+
      '<div><div style="font-size:14px;font-weight:600">'+esc(r.name)+'</div>'+
      '<div style="font-size:11px;color:var(--sub)">'+w+'g total · '+kPer100+' kcal/100g'+(r.servingSize?' · 1 porção = '+r.servingSize+'g':'')+'</div></div>'+
      '<span style="color:var(--accent);font-size:18px">›</span></div>';
  });
  h+='</div></div>';
  document.getElementById('modal-root').innerHTML=h;
  document.getElementById('rpClose').addEventListener('click',closeModal);
}

function openPortionPicker(idx){
  var r=S.recipes[idx];
  var totalW=(+r.cookedWeight)||(+r.rawWeight)||1;
  var mode=r.servingSize?'serving':'grams';
  function render2(){
    var h='<div class="overlay"><div class="sheet">'+
      '<div class="sheet-head"><h3>'+esc(r.name)+'</h3>'+
      '<button class="btn-ghost" id="ppClose" style="flex:0;padding:6px 14px">Fechar</button></div>'+
      '<div style="font-size:12px;color:var(--sub);margin-bottom:12px">Receita total: '+totalW+'g · '+r.totals.kcal+' kcal</div>';
    if(r.servingSize){
      h+='<label class="lbl">Como queres registar?</label>'+
        '<div class="seg" style="margin-bottom:10px">'+
        '<button class="'+(mode==='serving'?'on':'')+'" data-mode="serving">Por porção</button>'+
        '<button class="'+(mode==='grams'?'on':'')+'" data-mode="grams">Por peso (g)</button></div>';
    }
    if(mode==='serving'){
      h+='<label class="lbl">Número de porções (1 porção = '+r.servingSize+'g)</label>'+
        '<input id="ppAmount" type="number" inputmode="decimal" value="1" step="0.5" min="0" style="margin-bottom:14px">';
    }else{
      h+='<label class="lbl">Peso consumido (g)</label>'+
        '<input id="ppAmount" type="number" inputmode="numeric" value="100" min="0" style="margin-bottom:14px">';
    }
    h+='<div id="ppPreview" style="background:var(--accent-l);border-radius:10px;padding:12px;margin-bottom:14px"></div>';
    h+='<div class="row"><button class="btn-primary" id="ppSave">Adicionar à Refeição</button>'+
      '<button class="btn-ghost" id="ppCancel">Cancelar</button></div></div></div>';
    document.getElementById('modal-root').innerHTML=h;
    var amt=document.getElementById('ppAmount'),pv=document.getElementById('ppPreview');
    function recalc(){
      var n=+amt.value||0;
      var grams=mode==='serving'?n*(+r.servingSize||0):n;
      var ratio=grams/totalW;
      var calc={kcal:Math.round(r.totals.kcal*ratio),protein:Math.round(r.totals.protein*ratio*10)/10,carbs:Math.round(r.totals.carbs*ratio*10)/10,fat:Math.round(r.totals.fat*ratio*10)/10,sugar:Math.round((r.totals.sugar||0)*ratio*10)/10};
      pv.innerHTML='<div style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px">'+(mode==='serving'?n+' × porção':grams+' g')+'</div>'+
        '<div style="font-size:14px;line-height:1.8"><b>'+calc.kcal+' kcal</b> · P:'+calc.protein+'g · H:'+calc.carbs+'g · G:'+calc.fat+'g'+(calc.sugar?' · Aç:'+calc.sugar+'g':'')+'</div>';
      pv._calc=calc;pv._grams=grams;pv._n=n;
    }
    amt.addEventListener('input',recalc);recalc();
    document.getElementById('ppClose').addEventListener('click',closeModal);
    document.getElementById('ppCancel').addEventListener('click',closeModal);
    document.getElementById('ppSave').addEventListener('click',function(){
      var c=pv._calc;var label=r.name+' ('+(mode==='serving'?pv._n+'× porção':pv._grams+'g')+')';
      addMeal({name:label,kcal:c.kcal,protein:c.protein,carbs:c.carbs,fat:c.fat,sugar:c.sugar,id:Date.now(),fromRecipe:true});
    });
    document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){mode=b.getAttribute('data-mode');render2();});});
  }
  render2();
}

// ─── EVENT DELEGATION ───
document.body.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='tab'){S.tab=t.getAttribute('data-tab');if(S.tab==='Perfil')tmpP=Object.assign({},S.profile);render();}
  else if(act==='open-meal')openMeal();
  else if(act==='open-ex')openExercise();
  else if(act==='open-report')openReport();
  else if(act==='del-meal')deleteMeal(t.getAttribute('data-date'),t.getAttribute('data-id'));
  else if(act==='del-lib')removeFromLibrary(+t.getAttribute('data-idx'));
  else if(act==='gender'){tmpP.gender=t.getAttribute('data-val');renderContent();fixDecimalInputs();}
  else if(act==='goal'){tmpP.goal=t.getAttribute('data-val');renderContent();fixDecimalInputs();}
  else if(act==='save-profile'){S.profile=Object.assign({},tmpP);save(K.profile,S.profile);render();toast('Perfil guardado');}
  else if(act==='save-api'){var inp=document.querySelector('[data-field-api]');S.apiKey=inp?inp.value.trim():'';save(K.api,S.apiKey);toast(S.apiKey?'Chave guardada':'Chave removida');render();}
  else if(act==='theme'){S.theme=t.getAttribute('data-val');save(K.theme,S.theme);applyTheme();renderContent();fixDecimalInputs();}
  else if(act==='acc'){
    var id=t.getAttribute('data-acc');
    accOpen[id]=!accOpen[id];
    var body=document.getElementById('acc-'+id);
    var arrow=t.querySelector('.acc-arrow');
    if(body)body.classList.toggle('open',accOpen[id]);
    if(arrow)arrow.classList.toggle('open',accOpen[id]);
  }
  else if(act==='export')exportData();
  else if(act==='import'){var f=document.getElementById('importFile');if(f)f.click();}
  else if(act==='new-recipe')openRecipeEditor(-1);
  else if(act==='view-recipe')openRecipeEditor(+t.getAttribute('data-idx'));
  else if(act==='del-recipe'){e.stopPropagation();deleteRecipe(+t.getAttribute('data-idx'));}
  else if(act==='r-add-ing')openIngredientPicker();
  else if(act==='r-bulk-ing'){
    var nameInp=document.getElementById('rName');if(nameInp)recipeDraft.name=nameInp.value.trim();
    var cookedInp=document.getElementById('rCooked');if(cookedInp)recipeDraft.cookedWeight=cookedInp.value;
    var servInp=document.getElementById('rServing');if(servInp)recipeDraft.servingSize=servInp.value;
    openBulkIngredients();
  }
  else if(act==='r-del-ing'){recipeDraft.ingredients.splice(+t.getAttribute('data-i'),1);recalcRecipeTotals();renderRecipeEditor();}
  else if(act==='r-save'){
    var nameInp2=document.getElementById('rName'),cookedInp2=document.getElementById('rCooked'),servInp2=document.getElementById('rServing');
    if(nameInp2)recipeDraft.name=nameInp2.value.trim();
    if(cookedInp2)recipeDraft.cookedWeight=cookedInp2.value;
    if(servInp2)recipeDraft.servingSize=servInp2.value;
    saveRecipeDraft();
  }
  else if(act==='rp-pick')openPortionPicker(+t.getAttribute('data-idx'));
  else if(act==='set-range'){S.chartRange=+t.getAttribute('data-range');renderContent();}
});

document.body.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-field')){
    tmpP[t.getAttribute('data-field')]=t.value;
    var pv=document.getElementById('perfilPreview');if(pv)pv.innerHTML=previewCard(calcGoals(tmpP));
  }
});
document.body.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='importFile'&&t.files&&t.files[0]){importData(t.files[0]);t.value='';}
  else if(t.hasAttribute&&t.hasAttribute('data-field')&&t.tagName==='SELECT'){
    tmpP[t.getAttribute('data-field')]=t.value;
    var pv=document.getElementById('perfilPreview');if(pv)pv.innerHTML=previewCard(calcGoals(tmpP));
  }
});

function render(){renderHeader();renderContent();renderNav();fixDecimalInputs();animateUI();}
render();
// Also fix decimal inputs whenever a modal opens
var mo=new MutationObserver(function(){fixDecimalInputs();});
mo.observe(document.getElementById('modal-root'),{childList:true,subtree:true});
