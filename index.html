<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriTrack">
<meta name="theme-color" content="#2f9e44">
<title>NutriTrack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f9e44'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f9e44'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f8;--card:#fff;--border:#e2e8f0;--text:#1a202c;--sub:#718096;
    --accent:#2f9e44;--accent-l:#d3f9d8;--red:#e03131;--red-l:#ffe3e3;
    --yellow:#f59f00;--yellow-l:#fff9db;--blue:#1971c2;--blue-l:#dbe4ff;
    --pink:#e64980;--pink-l:#ffdeeb;--orange:#d9480f;--orange-l:#ffe8cc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  h3{margin:0;font-size:17px}
  input,select,button{font-family:inherit;font-size:15px}
  input,select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:10px 12px;width:100%;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .pad{padding:12px 12px 0}
  .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
  .row{display:flex;gap:8px;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
  .btn-primary:disabled{background:var(--border);color:var(--sub);cursor:default}
  .btn-ghost{flex:1;background:var(--bg);color:var(--sub);border:1px solid var(--border);border-radius:10px;padding:13px;cursor:pointer}
  .btn-sm{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .chip{border:none;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .chip-green{background:var(--accent-l);color:var(--accent)}
  .chip-yellow{background:var(--yellow-l);color:var(--yellow)}
  .chip-blue{background:var(--blue-l);color:var(--blue)}
  .tag{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600}
  .del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px}
  .gauge{background:var(--border);border-radius:8px;height:10px;overflow:hidden}
  .gauge>div{height:100%;border-radius:8px;transition:width .4s}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border-radius:8px;padding:10px 0;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--sub)}
  .seg button.on{background:var(--accent-l);color:var(--accent);border-color:var(--accent);font-weight:700}
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .goalgrid button{border-radius:10px;padding:10px 6px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;text-align:center}
  .goalgrid button.on{background:var(--accent-l);color:var(--accent);border-color:var(--accent);font-weight:700}
  .warn{background:var(--orange-l);border:1px solid var(--orange);border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .warn div{font-size:13px;color:var(--orange);line-height:1.5}
  #nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);
    border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  #nav button{flex:1;background:none;border:none;color:var(--sub);font-size:11px;cursor:pointer;padding:8px 2px;line-height:1.6}
  #nav button.on{color:var(--accent);font-weight:700}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px;max-height:88vh;overflow:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .statcard{background:var(--card);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid var(--border)}
  .statcard b{display:block;font-size:18px;font-weight:800}
  .statcard span{font-size:10px;color:var(--sub)}
  .libitem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card);
    border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid var(--border)}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
    padding:10px 18px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}
</style>

<div id="header"></div>
<div id="content"></div>
<div id="nav"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
//──────────── CONFIG & STORAGE ────────────
var K={data:'nutritrack_data',profile:'nutritrack_profile',library:'nutritrack_library',api:'nutritrack_apikey'};
var DEFAULT_PROFILE={age:'',weight:'',height:'',gender:'male',activity:'1.55',goal:'maintain',targetWeight:'',bodyFatCurrent:'',bodyFatTarget:''};
var ACTIVITY=[['1.2','Sedentário','Pouco ou nenhum exercício'],['1.375','Levemente ativo','Exercício 1–3x/semana'],
  ['1.55','Moderadamente ativo','Exercício 3–5x/semana'],['1.725','Muito ativo','Exercício 6–7x/semana'],
  ['1.9','Extremamente ativo','Atleta / trabalho físico intenso']];
var GOALS=[['gain','💪 Ganhar peso'],['lose','⬇️ Perder peso'],['maintain','⚖️ Manter peso'],['recomp','🔥 Perder gordura']];
var MIN_BF={male:5,female:12},WARN_BF={male:10,female:18};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'});}
function fmtFull(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

//──────────── STATE ────────────
var S={data:load(K.data,{}),profile:load(K.profile,DEFAULT_PROFILE),library:load(K.library,[]),apiKey:load(K.api,''),tab:'Hoje'};
var tmpP=Object.assign({},S.profile);
var meal=null;

//──────────── SCIENCE ────────────
function calcMifflin(p){
  if(!p.age||!p.weight||!p.height)return null;
  var a=+p.age,w=+p.weight,h=+p.height,act=+p.activity;
  var bmr=p.gender==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  return{bmr:Math.round(bmr),tdee:Math.round(bmr*act)};
}
function calcGoals(p){
  var base=calcMifflin(p); if(!base)return null;
  var bmr=base.bmr,tdee=base.tdee,w=+p.weight;
  if(p.goal==='maintain'){
    var pr=Math.round(w*1.6),ft=Math.round(tdee*.3/9),cb=Math.max(0,Math.round((tdee-pr*4-ft*9)/4));
    return{bmr:bmr,tdee:tdee,target:tdee,protein:pr,carbs:cb,fat:ft,deficit:0,warnings:[],targetDate:null,daysNeeded:null};
  }
  if(p.goal==='gain'){
    var t=tdee+400,pr=Math.round(w*2.2),ft=Math.round(t*.28/9),cb=Math.max(0,Math.round((t-pr*4-ft*9)/4));
    return{bmr:bmr,tdee:tdee,target:t,protein:pr,carbs:cb,fat:ft,deficit:-400,warnings:[],targetDate:null,daysNeeded:null};
  }
  if(p.goal==='lose'){
    var tw=+p.targetWeight,wr=[];
    if(!tw||tw>=w)return{bmr:bmr,tdee:tdee,target:tdee-500,protein:Math.round(w*2),carbs:150,fat:55,deficit:500,warnings:['Define o teu peso alvo no Perfil.'],targetDate:null,daysNeeded:null};
    var wl=Math.min(w*.0075,.9),def=Math.min(Math.round(wl*7700/7),750),t=Math.max(1200,tdee-def);
    if(def===750)wr.push('⚠️ Défice ajustado para −750 kcal/dia (máximo saudável, ACSM).');
    if(tw<w*.8)wr.push('⚠️ Objetivo ambicioso (>20% do peso). Consulta um profissional.');
    var pr=Math.round(w*2),ft=Math.round(t*.25/9),cb=Math.max(0,Math.round((t-pr*4-ft*9)/4));
    var days=Math.round((w-tw)*7700/def),td=new Date();td.setDate(td.getDate()+days);
    return{bmr:bmr,tdee:tdee,target:t,protein:pr,carbs:cb,fat:ft,deficit:def,warnings:wr,daysNeeded:days,targetDate:td.toISOString().slice(0,10)};
  }
  if(p.goal==='recomp'){
    var bfC=+p.bodyFatCurrent,bfT=+p.bodyFatTarget,wr=[];
    if(!bfC||!bfT||bfT>=bfC)return{bmr:bmr,tdee:tdee,target:tdee-350,protein:Math.round(w*2.4),carbs:130,fat:55,deficit:350,warnings:['Define a tua % de gordura atual e alvo no Perfil.'],targetDate:null,daysNeeded:null};
    var safe=Math.max(bfT,WARN_BF[p.gender]);
    if(bfT<MIN_BF[p.gender])wr.push('⚠️ % alvo abaixo do mínimo saudável. Ajustado para '+WARN_BF[p.gender]+'%.');
    var lean=w*(1-bfC/100),fatLose=w*(bfC/100)-(lean/(1-safe/100))*(safe/100);
    var def=p.gender==='male'?(bfC>20?500:bfC>15?350:250):(bfC>28?500:bfC>22?350:250);
    var t=Math.max(1200,tdee-def),pr=Math.round(lean*2.5),ft=Math.round(t*.28/9),cb=Math.max(0,Math.round((t-pr*4-ft*9)/4));
    var days=Math.round(Math.max(fatLose,.5)*7700/def),td=new Date();td.setDate(td.getDate()+days);
    return{bmr:bmr,tdee:tdee,target:t,protein:pr,carbs:cb,fat:ft,deficit:def,warnings:wr,daysNeeded:days,targetDate:td.toISOString().slice(0,10),fatMassToLose:Math.round(fatLose*10)/10,safeBfT:safe};
  }
  return null;
}
function totals(m){return (m||[]).filter(function(x){return !x.isExercise;}).reduce(function(a,x){return{kcal:a.kcal+x.kcal,protein:a.protein+x.protein,carbs:a.carbs+x.carbs,fat:a.fat+x.fat};},{kcal:0,protein:0,carbs:0,fat:0});}
function exKcal(m){return (m||[]).filter(function(x){return x.isExercise;}).reduce(function(s,x){return s+x.kcal;},0);}
function dynamicTarget(macro){
  if(!macro||!macro.targetDate||S.profile.goal==='maintain'||S.profile.goal==='gain')return macro;
  var days=Object.keys(S.data).sort();
  if(days.length<2)return macro;
  var dl=days.map(function(d){var m=S.data[d]||[];return macro.tdee-(totals(m).kcal-exKcal(m));}).filter(function(x){return x>50;});
  if(!dl.length)return macro;
  var avg=dl.reduce(function(a,b){return a+b;},0)/dl.length;
  var kg=S.profile.goal==='lose'?(+S.profile.weight)-(+S.profile.targetWeight||+S.profile.weight*.9):macro.fatMassToLose||5;
  var dn=Math.round(kg*7700/Math.max(avg,100)),td=new Date();td.setDate(td.getDate()+dn);
  var c=Object.assign({},macro);c.daysNeeded=dn;c.targetDate=td.toISOString().slice(0,10);return c;
}

//──────────── CHARTS (SVG) ────────────
function last7(){
  var out=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var key=d.toISOString().slice(0,10),m=S.data[key]||[],t=totals(m),ex=exKcal(m);
    out.push({date:key,label:d.toLocaleDateString('pt-PT',{weekday:'short'}).replace('.',''),kcal:t.kcal,protein:t.protein,carbs:t.carbs,fat:t.fat,net:t.kcal-ex});
  }
  return out;
}
function barChart(days,goal){
  var W=340,H=150,padL=8,padR=8,padB=24,padT=10,innerH=H-padB-padT;
  var vals=days.map(function(d){return d.net;});
  var max=Math.max.apply(null,[goal||0].concat(vals).concat([1]))*1.15;
  var slot=(W-padL-padR)/days.length,rects='',labels='';
  days.forEach(function(d,i){
    var bh=d.net>0?(d.net/max)*innerH:0,bw=slot*.6,x=padL+i*slot+(slot-bw)/2,y=padT+innerH-bh;
    var col=d.net===0?'var(--border)':d.net>goal?'var(--red)':'var(--accent)';
    rects+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="3" fill="'+col+'"/>';
    labels+='<text x="'+(padL+i*slot+slot/2).toFixed(1)+'" y="'+(H-7)+'" font-size="10" fill="var(--sub)" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  var gl='';
  if(goal){var gy=padT+innerH-(goal/max)*innerH;gl='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+gl+rects+labels+'</svg>';
}
function lineChart(days){
  var W=340,H=150,padL=8,padR=8,padB=24,padT=10,innerH=H-padB-padT;
  var all=[];days.forEach(function(d){all.push(d.protein,d.carbs,d.fat);});
  var max=Math.max.apply(null,all.concat([1]))*1.15;
  var slot=(W-padL-padR)/(days.length-1||1),paths='',labels='';
  [['protein','var(--blue)'],['carbs','var(--yellow)'],['fat','var(--pink)']].forEach(function(kc){
    var pts=days.map(function(d,i){var x=padL+i*slot,y=padT+innerH-(d[kc[0]]/max)*innerH;return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    paths+='<polyline points="'+pts+'" fill="none" stroke="'+kc[1]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  days.forEach(function(d,i){labels+='<text x="'+(padL+i*slot).toFixed(1)+'" y="'+(H-7)+'" font-size="10" fill="var(--sub)" text-anchor="middle">'+esc(d.label)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+paths+labels+'</svg>';
}

//──────────── UI HELPERS ────────────
function gauge(label,value,goal,color,unit){
  unit=unit||'g';var pct=Math.min(100,goal?Math.round(value/goal*100):0),over=value>goal;
  return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'+
    '<span style="font-weight:600">'+label+'</span><span style="color:'+(over?'var(--red)':'var(--accent)')+'">'+value+
    '<span style="color:var(--sub)">/'+goal+unit+'</span></span></div>'+
    '<div class="gauge"><div style="width:'+pct+'%;background:'+(over?'var(--red)':color)+'"></div></div></div>';
}
function tag(txt,color,bg){return '<span class="tag" style="color:'+color+';background:'+bg+'">'+txt+'</span>';}
function warnBox(ws){if(!ws||!ws.length)return '';return '<div class="warn">'+ws.map(function(w){return '<div>'+esc(w)+'</div>';}).join('')+'</div>';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

//──────────── COMPUTE ────────────
function compute(){
  var tk=today(),meals=S.data[tk]||[],macro=calcGoals(S.profile),active=dynamicTarget(macro);
  var tt=totals(meals),ex=exKcal(meals),net=tt.kcal-ex;
  var eff={kcal:macro?macro.target:2000,protein:macro?macro.protein:150,carbs:macro?macro.carbs:200,fat:macro?macro.fat:65};
  var balance=macro?macro.tdee-net:0;
  return{tk:tk,meals:meals,macro:macro,active:active,tt:tt,ex:ex,net:net,eff:eff,balance:balance};
}

//──────────── RENDER: HEADER ────────────
function renderHeader(){
  var h='<div style="background:var(--card);padding:18px 16px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="font-size:20px;font-weight:800;color:var(--accent)">🥗 NutriTrack</div>'+
    '<div style="font-size:12px;color:var(--sub)">'+fmt(today())+'</div></div>';
  if(S.tab==='Hoje')h+='<div style="display:flex;gap:8px">'+
    '<button class="chip chip-yellow" data-act="open-ex">🏃</button>'+
    '<button class="chip chip-green" data-act="open-meal">+ Refeição</button></div>';
  h+='</div>';
  document.getElementById('header').innerHTML=h;
}

//──────────── RENDER: NAV ────────────
function renderNav(){
  var icons={'Hoje':'🍽','Registo':'📋','Semana':'📅','Gráficos':'📊','Perfil':'👤'};
  var n='';['Hoje','Registo','Semana','Gráficos','Perfil'].forEach(function(t){
    n+='<button class="'+(S.tab===t?'on':'')+'" data-act="tab" data-tab="'+t+'">'+icons[t]+'<br>'+t+'</button>';
  });
  document.getElementById('nav').innerHTML=n;
}

//──────────── RENDER: CONTENT ────────────
function renderContent(){
  var c=compute(),html='';
  if(S.tab==='Hoje')html=viewHoje(c);
  else if(S.tab==='Registo')html=viewRegisto();
  else if(S.tab==='Semana')html=viewSemana(c);
  else if(S.tab==='Gráficos')html=viewGraficos(c);
  else if(S.tab==='Perfil')html=viewPerfil();
  document.getElementById('content').innerHTML=html;
}

function viewHoje(c){
  var h='<div class="pad">';
  h+=warnBox(c.macro&&c.macro.warnings);
  h+='<div class="card" style="background:var(--accent)"><div style="display:flex;justify-content:space-between;align-items:flex-start">'+
    '<div><div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:2px">Calorias líquidas hoje</div>'+
    '<div style="font-size:40px;font-weight:800;color:#fff;line-height:1">'+c.net+'</div>'+
    '<div style="font-size:13px;color:rgba(255,255,255,.75);margin-top:4px">de '+c.eff.kcal+' kcal · exercício: '+c.ex+' kcal</div></div>'+
    '<div style="text-align:right"><div style="font-size:12px;color:rgba(255,255,255,.8)">Balanço</div>'+
    '<div style="font-size:22px;font-weight:700;color:#fff">'+(c.balance>0?'+':'')+c.balance+'</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.7)">kcal</div></div></div></div>';
  if(c.active&&c.active.targetDate&&S.profile.goal!=='maintain'&&S.profile.goal!=='gain'){
    h+='<div class="card" style="background:var(--blue-l);border-left:4px solid var(--blue)">'+
      '<div style="font-size:12px;color:var(--blue);font-weight:700;margin-bottom:2px">🎯 Estimativa para atingir o objetivo</div>'+
      '<div style="font-size:15px;font-weight:700">'+fmtFull(c.active.targetDate)+' <span style="color:var(--sub);font-weight:400">('+c.active.daysNeeded+' dias)</span></div>';
    if(S.profile.goal==='lose')h+='<div style="font-size:12px;color:var(--sub);margin-top:2px">Peso alvo: '+S.profile.targetWeight+' kg · Défice: '+c.macro.deficit+' kcal/dia</div>';
    if(S.profile.goal==='recomp')h+='<div style="font-size:12px;color:var(--sub);margin-top:2px">% gordura alvo: '+c.active.safeBfT+'% · A perder: ~'+c.active.fatMassToLose+' kg</div>';
    h+='<div style="font-size:11px;color:var(--sub);margin-top:4px;font-style:italic">Recalculado diariamente com base nos dados reais.</div></div>';
  }
  h+='<div class="card">'+gauge('Calorias',c.net,c.eff.kcal,c.net>c.eff.kcal?'var(--red)':c.net>c.eff.kcal*.9?'var(--yellow)':'var(--accent)',' kcal')+
    gauge('Proteína',c.tt.protein,c.eff.protein,'var(--blue)')+gauge('Hidratos',c.tt.carbs,c.eff.carbs,'var(--yellow)')+
    gauge('Gordura',c.tt.fat,c.eff.fat,'var(--pink)')+'</div>';

//──────────── GEMINI API ────────────
function callAnthropic(messages,maxTokens,jsonMode){
  if(!S.apiKey)return Promise.reject(new Error('Sem chave API'));
  var contents=messages.map(function(m){
    return{role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]};
  });
  var cfg={maxOutputTokens:maxTokens,temperature:0.7};
  if(jsonMode)cfg.responseMimeType='application/json';
  var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
  return fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey},
    body:JSON.stringify({contents:contents,generationConfig:cfg})
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,140));});
    return r.json();
  }).then(function(d){
    try{return d.candidates[0].content.parts[0].text||'';}catch(e){return '';}
  });
}
// Robustly extract a JSON object from a possibly-noisy string
function extractJSON(txt){
  var clean=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  try{return JSON.parse(clean);}catch(e){}
  var s=clean.indexOf('{'),e2=clean.lastIndexOf('}');
  if(s>=0&&e2>s){
    try{return JSON.parse(clean.slice(s,e2+1));}catch(e){}
  }
  throw new Error('JSON inválido');
}
function apiErr(e){var m=(e&&e.message)||'erro';if(m.indexOf('400')>=0)return 'chave inválida';if(m.indexOf('401')>=0||m.indexOf('403')>=0)return 'chave inválida ou sem permissão';if(m.indexOf('429')>=0)return 'limite atingido';if(m.indexOf('Failed to fetch')>=0)return 'sem ligação';return m.slice(0,80);}

//──────────── DATA OPS ────────────
function addMeal(m){
  var tk=today();var arr=(S.data[tk]||[]).slice();arr.push(m);S.data[tk]=arr;save(K.data,S.data);
  closeModal();render();
}
function deleteMeal(date,id){
  if(!S.data[date])return;S.data[date]=S.data[date].filter(function(m){return String(m.id)!==String(id);});save(K.data,S.data);render();
}
function saveToLibrary(item){
  if(S.library.some(function(i){return i.name.toLowerCase()===item.name.toLowerCase();}))return;
  S.library=S.library.concat([item]);save(K.library,S.library);
}
function removeFromLibrary(idx){S.library=S.library.filter(function(_,i){return i!==idx;});save(K.library,S.library);render();}

function exportData(){
  var backup={version:1,exportedAt:new Date().toISOString(),profile:S.profile,data:S.data,library:S.library};
  var json=JSON.stringify(backup,null,2),filename='nutritrack_backup_'+today()+'.json';
  try{
    var file=new File([json],filename,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'NutriTrack Backup'}).catch(function(){fallbackDownload(json,filename);});
      return;
    }
  }catch(e){}
  fallbackDownload(json,filename);
}
function fallbackDownload(json,filename){
  var blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('Backup exportado');
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var b=JSON.parse(ev.target.result);
      if(!b.version||!b.data)throw new Error('inv');
      if(confirm('Isto irá substituir todos os dados atuais. Tens a certeza?')){
        if(b.data){S.data=b.data;save(K.data,S.data);}
        if(b.profile){S.profile=b.profile;tmpP=Object.assign({},b.profile);save(K.profile,S.profile);}
        if(b.library){S.library=b.library;save(K.library,S.library);}
        render();toast('✅ Dados restaurados');
      }
    }catch(e){toast('❌ Ficheiro inválido');}
  };
  reader.readAsText(file);
}

//──────────── EVENT DELEGATION ────────────
document.body.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='tab'){S.tab=t.getAttribute('data-tab');if(S.tab==='Perfil')tmpP=Object.assign({},S.profile);render();}
  else if(act==='open-meal')openMeal();
  else if(act==='open-ex')openExercise();
  else if(act==='open-report')openReport();
  else if(act==='del-meal')deleteMeal(t.getAttribute('data-date'),t.getAttribute('data-id'));
  else if(act==='del-lib')removeFromLibrary(+t.getAttribute('data-idx'));
  else if(act==='gender'){tmpP.gender=t.getAttribute('data-val');renderContent();}
  else if(act==='goal'){tmpP.goal=t.getAttribute('data-val');renderContent();}
  else if(act==='save-profile'){S.profile=Object.assign({},tmpP);save(K.profile,S.profile);render();toast('Perfil guardado');}
  else if(act==='save-api'){var inp=document.querySelector('[data-field-api]');S.apiKey=inp?inp.value.trim():'';save(K.api,S.apiKey);toast(S.apiKey?'Chave guardada':'Chave removida');render();}
  else if(act==='export')exportData();
  else if(act==='import'){var f=document.getElementById('importFile');if(f)f.click();}
});

document.body.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-field')){
    tmpP[t.getAttribute('data-field')]=t.value;
    var pv=document.getElementById('perfilPreview');if(pv)pv.innerHTML=previewCard(calcGoals(tmpP));
  }
});
document.body.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='importFile'&&t.files&&t.files[0]){importData(t.files[0]);t.value='';}
  else if(t.hasAttribute&&t.hasAttribute('data-field')&&t.tagName==='SELECT'){
    tmpP[t.getAttribute('data-field')]=t.value;
    var pv=document.getElementById('perfilPreview');if(pv)pv.innerHTML=previewCard(calcGoals(tmpP));
  }
});

//──────────── INIT ────────────
function render(){renderHeader();renderContent();renderNav();}
render();
</script>
